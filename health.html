:root{
  --paper:#E7E9E4; --raised:#F2F3F0; --ink:#14181F; --ink-soft:#5A6270;
  --rule:#CBCFC8; --signal:#B33A1A; --pine:#2F5D50;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --gutter:clamp(14px,4vw,28px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#14181F; --raised:#1B212A; --ink:#E7E9E4; --ink-soft:#8B94A3;
        --rule:#2C3540; --signal:#E0674A; --pine:#7FB3A1}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
main{padding:0 var(--gutter) 64px;max-width:720px;margin:0 auto}

.masthead{padding:calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) 0;
  max-width:720px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft)}
.eyebrow a{text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);
  line-height:.95;letter-spacing:-.03em;margin:8px 0 2px}
.standfirst{font-style:italic;color:var(--ink-soft);font-size:15px;
  margin:0 0 var(--gutter)}

.summary{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);
  font-size:12px;letter-spacing:.06em;color:var(--ink-soft);
  padding-bottom:12px;border-bottom:1.5px solid var(--ink);margin-bottom:4px}
.summary b{color:var(--ink);font-weight:500}

.row{display:flex;gap:12px;align-items:baseline;padding:13px 0;
  border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:none}
.dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:var(--pine);
  transform:translateY(-2px)}
.row.stale .dot{background:var(--ink-soft)}
.row.bad .dot{background:var(--signal)}
.name{font-family:var(--display);font-weight:600;font-size:16px;flex:1;min-width:0}
.detail{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  color:var(--ink-soft);margin-top:3px;word-break:break-word}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
  white-space:nowrap}

/* Muting lives here rather than in the reader: this page already lists every
   source, and the digest only needs to read the result. Same origin, same
   localStorage, so no plumbing between them. */
.mute{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  color:var(--ink-soft);background:none;border:1px solid var(--rule);
  border-radius:999px;padding:0 10px;min-height:32px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto}
.mute[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);
  color:var(--paper)}
.row.muted .name,.row.muted .detail,.row.muted .count{opacity:.45}
button{font:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
.hint{font-size:15px;color:var(--ink-soft);margin:0 0 4px}
.notice{margin:24px 0;padding:14px 16px;border:1px solid var(--rule);
  border-left:3px solid var(--signal);background:var(--raised)}
.notice h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 4px}
.notice p{margin:0;font-size:15px;color:var(--ink-soft)}
footer{padding:22px var(--gutter) 40px;max-width:720px;margin:0 auto;
  border-top:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.05em;color:var(--ink-soft)}

/* Wider screens, matching the digest. This page was already a centred column, so
   there is no alignment to fix — only type that was sized for a phone. */
@media (min-width:700px){
  .standfirst{font-size:16px;max-width:58ch}
  .hint{font-size:16px;max-width:62ch}
  .name{font-size:17px}
  .detail{font-size:11px}
  .row{padding:16px 0}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow"><a href="./">&lsaquo; back to the digest</a></div>
  <h1>Sources</h1>
  <p class="standfirst">With thirty sources, something is always broken.</p>
</header>

<main id="main"><p class="detail">loading…</p></main>
<footer id="footer"></footer>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function ago(iso){
  if (!iso) return "never";
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

/* Three states, not two. "ok but last seen four days ago" is the failure mode
   that actually loses you a source: nothing errors, the feed simply stopped
   being polled or stopped publishing, and it quietly leaves the digest. */
function classify(s){
  if (!s.status || !s.status.startsWith("ok") && s.status !== "not modified")
    return "bad";
  const days = s.at ? (Date.now() - new Date(s.at)) / 864e5 : 99;
  return days > 2 ? "stale" : "good";
}

(async () => {
  let data;
  try {
    const r = await fetch("data/health.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch {
    document.getElementById("main").innerHTML =
      `<div class="notice"><h2>No health data</h2>
       <p>Run the digest once and this page fills in.</p></div>`;
    return;
  }

  const sources = data.sources || [];
  const by = { bad: [], stale: [], good: [] };
  sources.forEach(s => by[classify(s)].push(s));

  /* Muted source ids, shared with the digest through localStorage. Disposable
     and per-device, like read state — never required for either page to work. */
  const MUTED_KEY = "muted";
  const loadMuted = () => {
    try { return new Set(JSON.parse(localStorage.getItem(MUTED_KEY) || "[]")); }
    catch { return new Set(); }
  };
  let muted = loadMuted();
  const saveMuted = () => {
    try { localStorage.setItem(MUTED_KEY, JSON.stringify([...muted])); } catch {}
  };

  const rowFor = (s) => {
    const cls = classify(s);
    const off = muted.has(s.id);
    return `<div class="row ${cls === "good" ? "" : cls}${off ? " muted" : ""}"
      data-id="${esc(s.id)}">
      <span class="dot"></span>
      <span class="name">${esc(s.name)}
        <div class="detail">${esc(s.status)} · ${ago(s.at)}</div></span>
      <span class="count">${s.items} item${s.items === 1 ? "" : "s"}</span>
      <button class="mute" data-mute="${esc(s.id)}" aria-pressed="${off}"
        >${off ? "muted" : "mute"}</button>
    </div>`;
  };

  const ordered = [...by.bad, ...by.stale, ...by.good];
  const draw = () => {
    document.getElementById("main").innerHTML =
      `<div class="summary">
         <span><b>${sources.length}</b> sources</span>
         <span><b>${by.good.length}</b> healthy</span>
         <span><b>${by.stale.length}</b> stale</span>
         <span><b>${by.bad.length}</b> failing</span>
         ${muted.size ? `<span><b>${muted.size}</b> muted</span>` : ""}
       </div>
       <p class="hint">Muting hides a story from the digest only when every
         source that carried it is muted — so it never costs you the
         corroboration two outlets give a story.</p>` +
      ordered.map(rowFor).join("");
  };
  draw();

  document.getElementById("main").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-mute]");
    if (!btn) return;
    const id = btn.dataset.mute;
    muted.has(id) ? muted.delete(id) : muted.add(id);
    saveMuted();
    draw();
  });

  document.getElementById("footer").textContent =
    "collected " + (data.generated_at || "").slice(0, 16).replace("T", " ") + " UTC";
})();
</script>
</body>
</html>
