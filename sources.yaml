# Display labels and per-topic interest multipliers. `interest` is the only
# editorial knob in the ranking formula; everything else is measured.
topics:
  ai:          {label: "AI",          interest: 1.15}
  engineering: {label: "Engineering", interest: 1.1}
  security:    {label: "Security",    interest: 1.1}
  devops:      {label: "DevOps",      interest: 1.0}
  cloud:       {label: "Cloud",       interest: 1.0}
  kubernetes:  {label: "Kubernetes",  interest: 1.0}
  databases:   {label: "Databases",   interest: 1.0}
  javascript:  {label: "JavaScript",  interest: 1.0}
  frontend:    {label: "Frontend",    interest: 1.0}
  react:       {label: "React",       interest: 1.0}
  node:        {label: "Node.js",     interest: 1.0}
  golang:      {label: "Go",          interest: 1.0}
  rust:        {label: "Rust",        interest: 1.0}
  jvm:         {label: "JVM",         interest: 1.0}
  ruby:        {label: "Ruby",        interest: 0.9}
  releases:    {label: "Releases",    interest: 0.9}
  programming: {label: "Programming", interest: 1.0}


# Keyword routing for `topics: auto` sources. Matched case-insensitively
# against title + blurb, whole-word where the term is ambiguous. An item
# matching nothing lands in `programming`, which is the catch-all.
routing:
  ai:          [ai, llm, llms, gpt, claude, anthropic, openai, gemini, mistral,
                transformer, embedding, inference, "machine learning", "neural network",
                diffusion, agentic, rag, chatbot, deepseek, "language model"]
  security:    [security, vulnerability, cve, exploit, malware, ransomware, breach,
                phishing, "supply chain", backdoor, cryptography, encryption, xss,
                sql injection, rce, zero-day, authentication, oauth, "0-day"]
  devops:      [devops, sre, observability, telemetry, "ci/cd", terraform, ansible,
                prometheus, grafana, incident, postmortem, "on-call", deployment,
                monitoring, opentelemetry]
  kubernetes:  [kubernetes, k8s, kubectl, helm, istio, containerd, "control plane"]
  cloud:       [aws, azure, "google cloud", gcp, cloudflare, serverless, lambda,
                s3, ec2, cloudfront, "edge compute"]
  databases:   [postgres, postgresql, mysql, sqlite, database, sql, redis, mongodb,
                clickhouse, duckdb, kafka, "query planner", oltp, olap]
  javascript:  [javascript, typescript, node.js, npm, deno, bun, ecmascript, "js "]
  react:       [react, next.js, nextjs, jsx, "react native", remix]
  frontend:    [css, html, browser, chrome, firefox, safari, webkit, dom, wasm,
                webassembly, accessibility, tailwind, "web component"]
  golang:      [golang, "go 1.", goroutine, "go module"]
  rust:        [rust, cargo, borrow checker, tokio, "rustc"]
  jvm:         [java, jvm, kotlin, spring boot, scala, gradle, maven, graalvm]
  ruby:        [ruby, rails, "ruby on rails"]
  releases:    [released, release, "version 1", "version 2", "now available",
                "general availability", ships, launches]
  engineering: [architecture, scaling, latency, throughput, migration, "case study",
                "we built", "how we", refactor, distributed, microservice]


# Ranking knobs. Score is
#   recency_decay x source_weight x corroboration x log(engagement) x interest
# and is deliberately arithmetic: its whole purpose is bounding token cost as
# source count grows, which an LLM at this stage would defeat.
ranking:
  half_life_hours: 36      # recency_decay = 0.5 ^ (age_hours / half_life)
  max_age_hours: 168       # nothing older than a week is eligible
  corroboration_bonus: 0.6 # multiplier is 1 + bonus x (sources - 1)
  per_source_cap: 6        # max items one source may contribute to one topic
                           # 6 of a 12 budget: enough that a single curated
                           # newsletter can carry a narrow topic on its own,
                           # not enough for an aggregator to own one
  topic_budget: 12         # max items published per (date, topic)
  min_topic_items: 2       # below this a topic is not published at all

  # Near-duplicate detection over titles. Replaced a SimHash Hamming
  # threshold, which could not separate the classes on real data — see
  # models.titles_match for the measurements.
  title_jaccard: 0.8       # token-set overlap that counts as the same story
  min_title_tokens: 3      # below this, subset matching is off (too greedy)
