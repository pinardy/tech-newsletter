# Source registry. Adding a source is a config edit, never a code change.
#
# Every URL below was fetched and asserted to be a parseable feed with at
# least one recent entry (see `python run.py verify`). Two sources named in
# CHANGES.md are absent because their documented feed URLs serve HTML, not a
# feed: Python Weekly and tl;dr sec both moved to beehiiv. Restore them by
# adding the correct rss.beehiiv.com URL.
#
# adapter:
#   feed        one RSS/Atom entry == one story
#   newsletter  one entry == an issue; stories are the outbound links inside
#               it, which are click-wrappers and must be HEAD-resolved
#   hn          Algolia search API (JSON), not a feed
#
# topics: fixed list, or `auto` to route each item by the keyword rules at the
# bottom of this file. Aggregators are `auto` — that routing is what lets an
# HN thread corroborate a JavaScript Weekly link.
#
# cadence_minutes: floor on re-polling. Set by feed turnover, not preference:
# a source is safe while it publishes fewer items per interval than its feed
# carries. lobste.rs and r/programming carry ~25 entries and turn over about
# that fast, so they set the 6h floor for the whole schedule.

# Public URL of the published site. Used for <link> in the outbound RSS feed;
# set this to your Pages URL.
site: "https://pinardy.github.io/tech-newsletter"

defaults:
  cadence_minutes: 360
  weight: 1.0

sources:

  # ── Curated newsletters ─────────────────────────────────────────
  # The backbone. High weight: a human already decided these were worth
  # printing. One publisher (Cooper Press), one feed shape, seven topics.
  - id: javascriptweekly
    name: JavaScript Weekly
    adapter: newsletter
    url: https://javascriptweekly.com/rss
    topics: [javascript]
    weight: 1.3
    cadence_minutes: 1440

  - id: nodeweekly
    name: Node Weekly
    adapter: newsletter
    url: https://nodeweekly.com/rss
    topics: [node]
    weight: 1.3
    cadence_minutes: 1440

  - id: reactstatus
    name: React Status
    adapter: newsletter
    url: https://react.statuscode.com/rss
    topics: [react]
    weight: 1.3
    cadence_minutes: 1440

  - id: frontendfocus
    name: Frontend Focus
    adapter: newsletter
    url: https://frontendfoc.us/rss
    topics: [frontend]
    weight: 1.3
    cadence_minutes: 1440

  - id: golangweekly
    name: Golang Weekly
    adapter: newsletter
    url: https://golangweekly.com/rss
    topics: [golang]
    weight: 1.3
    cadence_minutes: 1440

  - id: postgresweekly
    name: Postgres Weekly
    adapter: newsletter
    url: https://postgresweekly.com/rss
    topics: [databases]
    weight: 1.2
    cadence_minutes: 1440

  - id: dbweekly
    name: DB Weekly
    adapter: newsletter
    url: https://dbweekly.com/rss
    topics: [databases]
    weight: 1.2
    cadence_minutes: 1440

  - id: rubyweekly
    name: Ruby Weekly
    adapter: newsletter
    url: https://rubyweekly.com/rss
    topics: [ruby]
    weight: 1.2
    cadence_minutes: 1440

  - id: sreweekly
    name: SRE Weekly
    adapter: newsletter
    url: https://sreweekly.com/feed/
    topics: [devops]
    weight: 1.2
    cadence_minutes: 1440

  - id: importai
    name: Import AI
    adapter: feed
    url: https://jack-clark.net/feed/
    topics: [ai]
    weight: 1.1
    cadence_minutes: 1440

  # ── Aggregators ─────────────────────────────────────────────────
  # Low weight and hard-capped downstream: their value is corroboration,
  # not the individual item.
  - id: hackernews
    name: Hacker News
    adapter: hn
    url: https://hn.algolia.com/api/v1/search_by_date
    min_points: 150
    topics: auto
    weight: 0.8
    cadence_minutes: 360

  - id: lobsters
    name: Lobsters
    adapter: feed
    url: https://lobste.rs/rss
    topics: auto
    weight: 0.7
    cadence_minutes: 360

  - id: rprogramming
    name: r/programming
    adapter: feed
    url: https://www.reddit.com/r/programming/.rss
    topics: auto
    weight: 0.6
    cadence_minutes: 360

  - id: infoq
    name: InfoQ
    adapter: feed
    url: https://feed.infoq.com/
    topics: auto
    weight: 0.8
    cadence_minutes: 360

  - id: changelog
    name: Changelog
    adapter: feed
    url: https://changelog.com/feed
    topics: auto
    weight: 0.9
    cadence_minutes: 720

  # ── Company engineering blogs ───────────────────────────────────
  # Fanned into a shared `engineering` topic so no one company dominates
  # a section.
  - id: cloudflare
