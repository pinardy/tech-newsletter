<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire — tech digest</title>
<meta name="description" content="One digest a day, merged from thirty sources.">

<!-- Two values, not one. A single light theme-color leaves the browser chrome
     pale against a near-black page for every reader in dark mode. -->
<meta name="theme-color" content="#E7E9E4" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#14181F" media="(prefers-color-scheme:dark)">

<link rel="manifest" href="manifest.webmanifest">
<!-- Both, deliberately. icon.svg swaps in pixel-grid artwork below 40px and is
     what modern browsers prefer; favicon.ico carries the same two drawings as
     real bitmaps for the browsers that ignore either. The explicit link is not
     optional here — an implicit /favicon.ico probe would hit the domain root,
     and this site is served from a subpath. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS ignores the manifest when it makes a home-screen icon, so the PWA the
     safe-area padding exists for would install with a screenshot without these. -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wire">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Type is self-hosted. Loaded from Google, a render-blocking stylesheet on
     two extra hosts gates first paint — which sits badly beside a 2.5s data
     timeout — and offline, the case the service worker exists for, the page
     falls back to Georgia and reflows. `latin` is precached by the worker;
     `latin-ext` is fetched only if a headline needs it, then cached at runtime. -->
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-600-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>

:root{
  --paper:#E7E9E4;
  --raised:#F2F3F0;
  --ink:#14181F;
  --ink-soft:#5A6270;
  --rule:#CBCFC8;
  --signal:#B33A1A;
  --pine:#2F5D50;

  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;

  --gutter:clamp(14px,4vw,28px);
  --measure:720px;
  /* Five strokes plus their gaps come to 22px; the column is sized to that
     rather than to the count text, which now only appears above five sources.
     Fixed, not shrink-to-fit: the strokes need a common left origin or the
     shapes stop being comparable down the column, and headlines would stop
     lining up row to row. */
  --tally-w:28px;
  --veil:color-mix(in srgb,var(--paper) 92%,transparent);
  /* Touch targets. 44px is the iOS and WCAG 2.5.5 floor; chips sit a little
     under it because three stacked control rows would otherwise eat a fifth
     of a phone screen before a single headline. */
  --tap:44px;
  --tap-chip:38px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14181F; --raised:#1B212A; --ink:#E7E9E4; --ink-soft:#8B94A3;
    --rule:#2C3540; --signal:#E0674A; --pine:#7FB3A1;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
main:focus{outline:none}

/* Screen-reader-only. Several things on this page are legible purely as shape —
   the tally, the unread dot — and each needs a text equivalent. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Masthead ─────────────────────────────────────────────────── */
.masthead{padding:calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) 0}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--signal)}
.wordmark{
  font-family:var(--display); font-weight:800;
  font-size:clamp(38px,13vw,68px); line-height:.9;
  letter-spacing:-.035em; margin:8px 0 2px;
}
.standfirst{
  font-family:var(--body); font-style:italic; color:var(--ink-soft);
  font-size:15px; margin:0 0 var(--gutter);
}

/* ── Sticky controls ──────────────────────────────────────────── */
.controls{
  position:sticky; top:0; z-index:20;
  background:var(--veil);
  backdrop-filter:blur(10px);
  border-block:1px solid var(--rule);
}
.datebar{
  display:flex; align-items:center; gap:6px;
  padding:0 calc(var(--gutter) - 8px); font-family:var(--mono); font-size:12px;
}
.navbtn{
  border:1px solid var(--rule); border-radius:999px;
  width:var(--tap); height:var(--tap); line-height:1;
  display:grid; place-items:center; flex:0 0 auto; font-size:15px;
}
.navbtn[disabled]{opacity:.3;cursor:default}

/* The edition list doubles as the date display and the jump target: with 120
   days retained, stepping one day at a time is 120 clicks to reach the end. */
.editionwrap{position:relative; flex:1; min-width:0; display:flex}
.editions{
  flex:1; min-width:0; height:var(--tap);
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--ink); background:none; border:none; cursor:pointer;
  padding:0 22px 0 8px; appearance:none; -webkit-appearance:none;
  text-overflow:ellipsis;
}
.editionwrap .caret{position:absolute; right:6px; top:50%; translate:0 -50%;
  font-style:normal; font-size:10px; color:var(--ink-soft); pointer-events:none}

/* A 17-topic row scrolls, and nothing said so: no scrollbar, no edge cue, and
   the reader's own selection could sit off-screen where they cannot unset it.
   The fades are the cue; `selected first` in drawChips is the other half. */
.chipwrap{position:relative}
.chipwrap::before,.chipwrap::after{
  content:""; position:absolute; top:0; bottom:0; width:26px; z-index:1;
  pointer-events:none; opacity:0; transition:opacity .15s;
}
.chipwrap::before{left:0;background:linear-gradient(90deg,var(--veil),transparent)}
.chipwrap::after{right:0;background:linear-gradient(270deg,var(--veil),transparent)}
.chipwrap.fade-l::before{opacity:1}
.chipwrap.fade-r::after{opacity:1}

.chips{display:flex; gap:7px; overflow-x:auto; padding:0 var(--gutter) 8px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; font-family:var(--mono); font-size:12px; letter-spacing:.04em;
  min-height:var(--tap-chip); padding:0 12px;
  display:inline-flex; align-items:center;
  border:1px solid var(--rule); border-radius:999px;
  color:var(--ink-soft); white-space:nowrap; transition:background .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.chip .n{opacity:.55;margin-left:5px}
/* Dimmed, not disabled: a topic with nothing today is still worth picking for
   the day you navigate to next. */
.chip.empty{opacity:.42}

.filterbar{display:flex; gap:8px; padding:0 var(--gutter) 8px; align-items:stretch}
.search{
  flex:1; min-width:0; font-family:var(--mono); font-size:13px;
  min-height:var(--tap-chip); padding:0 11px; background:var(--raised);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink);
}
.search::placeholder{color:var(--ink-soft)}
.toggle{
  flex:0 0 auto; font-family:var(--mono); font-size:12px; letter-spacing:.04em;
  min-height:var(--tap-chip); padding:0 13px;
  border:1px solid var(--rule); border-radius:4px; color:var(--ink-soft);
}
.toggle[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--paper)}

/* Fetches are network-first with a 2.5s fallback, so a topic toggle on a weak
   connection could sit for seconds showing the previous day with no signal. */
.progress{height:2px;overflow:hidden;background:transparent}
.progress i{display:block;height:100%;width:38%;background:var(--signal);
  animation:slide 1.1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(360%)}}

/* ── Digest body ──────────────────────────────────────────────── */
main{padding:0 var(--gutter) 64px; max-width:var(--measure); margin:0 auto}
main[aria-busy="true"]{opacity:.45;transition:opacity .12s}

.scope{
  font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  color:var(--ink-soft); margin:18px 0 0; padding-bottom:2px;
}
.scope b{color:var(--ink);font-weight:500}

.section-head{
  display:flex; align-items:baseline; gap:12px;
  margin:34px 0 4px; padding-bottom:6px; border-bottom:1.5px solid var(--ink);
}
.section-head h2{
  font-family:var(--display); font-weight:600; font-size:19px;
  letter-spacing:-.01em; margin:0; flex:1;
}
.section-head .topic{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--pine);
}

/* padding-left gives the unread dot a home that does not depend on the tally
   column existing, so the dot sits in the same place on every row whether or
   not that story has a tally. */
.story{display:flex; gap:12px; padding:16px 0 16px 16px; position:relative;
  border-bottom:1px solid var(--rule); cursor:pointer}
.story:last-child{border-bottom:none}
.story:hover h3 a{text-decoration:underline;text-decoration-color:var(--signal);
  text-underline-offset:3px}

/* ── Signature: the corroboration tally ───────────────────────── */
/* One stroke per independent source that carried the story. Groups of five are
   struck through, so "everyone ran this" is legible before the headline.
   Rendered only at two sources or more: on real data all but a handful of
   stories carry one source, and a column that says "1" on every row spends the
   most prominent 38px on the page to say nothing. Absent, the story runs full
   width — so seeing a tally at all already means corroboration. */
/* The margin is separation from the unread dot, which is also signal red and
   would otherwise read as a third stroke. Only corroborated rows pay for it —
   solo stories keep the full measure for their headline. */
.tally{flex:0 0 var(--tally-w); padding-top:7px; margin-left:6px}
.tally-groups{display:flex; flex-wrap:wrap; gap:7px}
.tally-group{position:relative; display:flex; gap:3px; height:15px}
.stroke{
  width:2px; height:15px; background:var(--signal);
  transform-origin:bottom; animation:grow .5s cubic-bezier(.2,.9,.3,1) backwards;
}
.tally-group.full .strike{
  position:absolute; inset:0; width:100%; height:15px;
}
.tally-group.full .strike::after{
  content:""; position:absolute; left:-3px; right:-3px; top:50%;
  height:2px; background:var(--signal); transform:rotate(-24deg);
}
/* Shown only once the strokes stop being countable at a glance. At two sources
   "2src" is wider and heavier than the mark it labels, which inverts the point:
   the shape is the signal. The exact number is always on the aria-label. */
.tally-count{
  font-family:var(--mono); font-size:10px; color:var(--ink-soft);
  margin-top:5px; letter-spacing:.06em;
}
.tally-count[hidden]{display:none}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

.story-body{flex:1; min-width:0}
.story h3{
  font-family:var(--display); font-weight:600; font-size:17px;
  line-height:1.28; letter-spacing:-.012em; margin:0 0 5px;
}
.story h3 a{text-decoration:none}
.story p{margin:0 0 7px; font-size:15.5px; color:var(--ink-soft); line-height:1.45}
.meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  color:var(--ink-soft); display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.meta .sep{opacity:.4}
.meta .src{color:var(--ink)}
/* The arc reads "day 3 · was 2 src": the tally moving, not a reading of it.
   Pine, not signal — signal stays reserved for the tally and unread. */
.meta .arc{color:var(--pine)}

/* Unread marker. The only other thing on the page allowed to be signal red.
   Absolutely positioned into the story's left padding rather than inline: an
   inline dot pushes the first line right and leaves wrapped lines behind it,
   so the left edge of every headline would shift as stories are read. */
.story.unread::before{
  content:""; position:absolute; left:2px; top:24px;
  width:6px; height:6px; border-radius:50%; background:var(--signal);
}

/* Save is a text button rather than a star: the row already carries one piece of
   iconography that means something (the tally), and a second would compete. */
.save{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  color:var(--ink-soft); padding:1px 5px; margin-left:auto;
  border:1px solid transparent; border-radius:3px}
.save:hover{border-color:var(--rule)}
.save[aria-pressed="true"]{color:var(--pine)}

/* Catch-up and the archive both put more than one day on screen, so each day
   needs a rule saying which it is. */
.daterule{display:flex; align-items:center; gap:10px; margin:32px 0 0;
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--pine)}
.daterule::after{content:""; flex:1; height:1px; background:var(--rule)}

/* Reading a rollup rather than a day is a different mode, and the date alone
   does not say so. */
.badge{font-family:var(--mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--paper); background:var(--pine);
  padding:3px 5px; border-radius:3px; flex:0 0 auto}

/* ── States ───────────────────────────────────────────────────── */
.notice{
  margin:24px 0; padding:14px 16px; border:1px solid var(--rule);
  border-left:3px solid var(--signal); background:var(--raised);
}
.notice h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 4px}
.notice p{margin:0;font-size:15px;color:var(--ink-soft)}
.notice button{text-decoration:underline;text-underline-offset:2px}
.skeleton{height:13px;background:var(--rule);border-radius:2px;opacity:.5;
  margin:11px 0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.22}}

footer{
  padding:22px var(--gutter) 40px; max-width:var(--measure); margin:0 auto;
  border-top:1px solid var(--rule); font-family:var(--mono);
  font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft);
}
footer button,footer a{text-decoration:underline;text-underline-offset:2px}
.offline{
  position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:30;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  background:var(--ink); color:var(--paper); padding:7px 14px; border-radius:999px;
}
[hidden]{display:none !important}

/* ── Wider screens ─────────────────────────────────────────────────
   Everything here is additive. The phone layout above is untouched, and two of
   its compromises stop being necessary once there is room.

   The sticky bar and the masthead spanned the window while the digest sat in a
   centred column, so at 1440px the wordmark, the date and the chips all lined up
   against the left edge of the screen and the text began 360px away. And a 602px
   measure at 15.5px runs to about ninety characters, half again the length the
   eye tracks back reliably. */
@media (min-width:700px){
  /* The bar keeps its full-width ground and rules — a sticky strip should span
     the window — and only its contents move in over the column. */
  .masthead, .datebar, .chipwrap, .filterbar{
    max-width:var(--measure); margin-inline:auto;
  }

  .standfirst{font-size:16px; max-width:58ch}
  .section-head{margin-top:40px}
  .section-head h2{font-size:21px}

  .story{padding:20px 0 20px 16px}
  .story h3{font-size:18.5px}
  /* Headlines may run the full column; they are two lines at most. Running text
     gets a ceiling in characters instead, which is what actually governs how
     hard a line is to follow back to its start. */
  .story p{font-size:16.5px; line-height:1.55; max-width:62ch}
  .meta{font-size:11px}
  .notice p{font-size:16px; max-width:62ch}

  /* On a phone the save button is pushed to the far edge to keep it clear of the
     text it sits under. Across a 664px row that same rule strands it a long way
     from the metadata it belongs to, so here it just follows the timestamp. */
  .save{margin-left:6px}

  /* The date select stretches to fill its row, which on a phone is right and
     here leaves the two arrows at opposite ends of the column with the date
     marooned between them. Let it size to its content so the three read as one
     control. */
  .editionwrap{flex:0 0 auto; max-width:100%}
}

@media (min-width:1000px){
  /* The chip row deliberately still scrolls rather than wrapping. Seventeen
     chips wrap to three rows at this column width, which would grow the sticky
     header from 138px to 228px — a quarter of a laptop viewport spent
     permanently on a filter, to save a sideways scroll. The fades and
     selected-first ordering already carry that row. */

  /* Hang the tally in the page margin, outside the reading column. Every
     headline then starts at the same place and corroboration is still legible
     before the text — the indent that buys it on a phone costs measure, and only
     costs it because a phone has no margin to spend. */
  .story{padding-left:0}
  .tally{position:absolute; left:-58px; top:20px; margin:0;
    width:var(--tally-w); flex:none}
  .story.unread::before{left:-16px; top:28px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">
    <span class="dot" aria-hidden="true"></span>
    <span id="sourceline">loading</span>
  </div>
  <h1 class="wordmark">Wire</h1>
  <p class="standfirst">One digest a day, merged from thirty sources.</p>
</header>

<div class="controls">
  <div class="datebar">
    <button class="navbtn" id="prev" aria-label="Previous edition">‹</button>
    <span class="editionwrap">
      <select class="editions" id="editions" aria-label="Edition"></select>
      <i class="caret" aria-hidden="true">▾</i>
    </span>
    <span class="badge" id="modebadge" hidden>week</span>
    <button class="navbtn" id="next" aria-label="Next edition">›</button>
  </div>
  <div class="chipwrap" id="chipwrap">
    <div class="chips" id="chips" role="group" aria-label="Topics"></div>
  </div>
  <div class="filterbar">
    <input class="search" id="search" type="search" placeholder="filter headlines"
           aria-label="Filter headlines across every topic in this edition">
    <button class="toggle" id="unreadonly" aria-pressed="false">unread</button>
    <button class="toggle" id="catchup" aria-pressed="false"
            title="Unread across the last seven editions">catch up</button>
  </div>
  <div class="progress" id="progress" hidden aria-hidden="true"><i></i></div>
</div>

<main id="main" tabindex="-1">
  <div class="skeleton" style="width:60%"></div>
  <div class="skeleton" style="width:85%"></div>
  <div class="skeleton" style="width:72%"></div>
</main>

<p class="sr" id="status" role="status" aria-live="polite"></p>
<footer id="footer"></footer>
<div class="offline" id="offline" hidden>offline — showing cached</div>

<script>
const DATA = "data/";
const CATCHUP = 7;          // editions a catch-up spans
const ARCHIVE_CAP = 200;    // results drawn before the list stops being useful

const state = {
  manifest:null,
  mode:"daily",       // "daily" | "weekly" — two date-spaces, one shard shape
  date:null,
  topics:new Set(),
  query:"",
  unreadOnly:false,
  catchUp:false,      // the last CATCHUP editions, unread only
  view:"digest",      // "digest" | "saved" | "archive"
  archive:null,       // built lazily, only if someone searches the archive
  shards:new Map(),
  shown:[],
  rendered:new Map(), // id -> the record `save` needs, for whatever is on screen
  read:new Set(),
  saved:new Map(),
  muted:new Set(),
  built:null,
  gen:0,
};

/* ── Per-device state ──────────────────────────────────────────────────
   Read, saved and muted are all disposable and all wrapped in try/catch: none
   of them may ever be required for the page to render. Item ids are stable (an
   FNV hash of the canonical URL), so they hold across days, topics and rollups. */
const READ_KEY = "read",  READ_CAP  = 4000;
const SAVED_KEY = "saved", SAVED_CAP = 500;
const MUTED_KEY = "muted";      // written by health.html, only read here

function loadRead(){
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveRead(){
  try {
    localStorage.setItem(READ_KEY,
      JSON.stringify([...state.read].slice(-READ_CAP)));
  } catch {}
}

/* Saved items carry their own copy of everything needed to draw them. The shard
   they came from is pruned at 120 days, and a reading list that empties itself
   on a retention boundary is not a reading list. */
function loadSaved(){
  try { return new Map(JSON.parse(localStorage.getItem(SAVED_KEY) || "[]")); }
  catch { return new Map(); }
}
function saveSaved(){
  try {
    localStorage.setItem(SAVED_KEY,
      JSON.stringify([...state.saved].slice(-SAVED_CAP)));
  } catch {}
}
function loadMuted(){
  try { return new Set(JSON.parse(localStorage.getItem(MUTED_KEY) || "[]")); }
  catch { return new Set(); }
}

/* Deliberately does not re-render, even with the unread filter on: pulling a
   story out from under the finger that just opened it loses the reader their
   place. It leaves on the next render. */
function markRead(id, el){
  if (state.read.has(id)) return;
  state.read.add(id);
  saveRead();
  el?.classList.remove("unread");
  el?.querySelector(".sr-unread")?.remove();
  updateFooter();
}

function toggleSave(id, btn){
  if (state.saved.has(id)) state.saved.delete(id);
  else {
    const record = state.rendered.get(id);
    if (!record) return;
    state.saved.set(id, record);
  }
  saveSaved();
  const on = state.saved.has(id);
  btn.setAttribute("aria-pressed", String(on));
  btn.textContent = on ? "saved" : "save";
  updateFooter();
  if (state.view === "saved") rerender();
}

/* URL hash is the source of truth for shareable state — edition space, date,
   topics, query, filters — so any view can be sent to someone. localStorage
   only remembers topic choice between visits and is never required to work. */
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("m") === "w") state.mode = "weekly";
  if (p.get("d")) state.date = p.get("d");
  if (p.get("t")) state.topics = new Set(p.get("t").split(",").filter(Boolean));
  if (p.get("q")) state.query = p.get("q");
  if (p.get("u") === "1") state.unreadOnly = true;
  if (p.get("c") === "1"){
    // Catch-up is a span of daily editions by definition; it cannot coexist
    // with a single rollup, and it means unread.
    state.catchUp = true; state.unreadOnly = true; state.mode = "daily";
  }
  if (p.get("v") === "s") state.view = "saved";
}
function writeHash(){
  const p = new URLSearchParams();
  if (state.mode === "weekly") p.set("m", "w");
  if (state.date) p.set("d", state.date);
  if (state.topics.size) p.set("t", [...state.topics].join(","));
  if (state.query.trim()) p.set("q", state.query.trim());
  if (state.unreadOnly) p.set("u", "1");
  if (state.catchUp) p.set("c", "1");
  if (state.view === "saved") p.set("v", "s");
  history.replaceState(null, "", "#" + p);
  try { localStorage.setItem("topics", [...state.topics].join(",")); } catch {}
  postTopics();
}

/* The worker decides what to keep readable offline, but it cannot see
   localStorage — so it has to be told, or it precaches every topic in the
   manifest to serve a reader of three. It ignores an unchanged set, which is why
   this can be called on every state change without thinking about it. */
function postTopics(){
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready
    .then(reg => reg.active?.postMessage({ type:"topics", topics:[...state.topics] }))
    .catch(() => {});
}

function restoreTopics(){
  if (state.topics.size) return;
  try {
    const saved = localStorage.getItem("topics");
    if (saved) state.topics = new Set(saved.split(",").filter(Boolean));
  } catch {}
}

async function getJSON(path){
  const r = await fetch(DATA + path, { cache:"no-cache" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

/* Dailies and rollups are the same shard shape in two date-spaces, so
   everything downstream of these three lines is shared. */
const editionDates = () =>
  (state.mode === "weekly" ? state.manifest.weeks : state.manifest.dates) || [];
const shardsFor = date =>
  ((state.mode === "weekly" ? state.manifest.weekly : state.manifest.shards) || {})[date] || {};
const shardPrefix = () => state.mode === "weekly" ? "weekly/" : "";

async function loadShard(date, topic){
  const key = state.mode + "/" + date + "/" + topic;
  if (state.shards.has(key)) return state.shards.get(key);
  const data = await getJSON(shardPrefix() + date + "/" + topic + ".json")
    .catch(() => null);
  state.shards.set(key, data);
  return data;
}

const topicLabel = id => state.manifest?.topics?.[id]?.label || id;

/* ── Tally: one stroke per source, struck through in fives ── */
const TALLY_MAX = 20;   // wraps rather than truncating; the label is exact
function tally(n){
  const groups = [];
  let left = Math.min(n, TALLY_MAX);
  let i = 0;
  while (left > 0){
    const size = Math.min(left, 5);
    const strokes = Array.from({length:size}, () =>
      `<i class="stroke" style="animation-delay:${(i++) * 45}ms"></i>`).join("");
    groups.push(
      `<span class="tally-group${size === 5 ? " full" : ""}">${strokes}` +
      (size === 5 ? `<i class="strike"></i>` : "") + `</span>`);
    left -= size;
  }
  // role=img with a label: the strokes are empty elements, so without this a
  // screen reader gets either nothing or a run of blanks.
  return `<div class="tally" role="img" aria-label="${n} sources carried this story">` +
         `<div class="tally-groups">${groups.join("")}</div>` +
         `<div class="tally-count"${n > 5 ? "" : " hidden"}>${n}&#8202;src</div></div>`;
}

/* Relative time is only meaningful where "now" is the frame: today's edition, or
   a catch-up that by definition spans the last week. On a rollup, an archive
   result or an edition four weeks back, "31d ago" is accurate and useless. */
function when(iso){
  const d = new Date(iso);
  const relative = state.mode === "daily" && state.view === "digest"
    && (state.catchUp || state.date === state.manifest?.latest);
  if (!relative)
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short" }) + " " +
           d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  const h = (Date.now() - d) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* A story is hidden only when every source that carried it is muted. Muting
   Hacker News should not cost you a story Lobsters also ran — that would throw
   away the corroboration this whole thing is built to show. */
function allMuted(item){
  const ids = (item.sources || []).map(s => s.id);
  return state.muted.size > 0 && ids.length > 0
    && ids.every(id => state.muted.has(id));
}

/* `ctx` replaces the source list for rows that have no sources to show — a
   saved record or an archive hit, where the useful context is which edition it
   came out of. */
function storyHTML(item, ctx){
  const names = (item.sources || []).map(s => s.name);
  const shown = ctx ? esc(ctx)
    : names.slice(0, 2).map(esc).join(", ") +
      (names.length > 2 ? ` +${names.length - 2}` : "");
  const unread = state.read.has(item.id) ? "" : " unread";
  const saved = state.saved.has(item.id);
  /* Only present when the story was published before and came back because
     it gained a source — so it always says something the tally alone cannot. */
  const arc = item.arc
    ? `<span class="sep">/</span><span class="arc">day ${item.arc.days} ·
       was ${item.arc.was}&#8202;src</span>`
    : "";
  const stamp = item.published_at
    ? `<span class="sep">/</span>
       <span class="when" data-iso="${esc(item.published_at)}">${when(item.published_at)}</span>`
    : "";
  return `<article class="story${unread}" data-id="${esc(item.id)}" data-url="${esc(item.url)}">
    ${unread ? `<span class="sr sr-unread">unread</span>` : ""}
    ${item.source_count > 1 ? tally(item.source_count) : ""}
    <div class="story-body">
      <h3><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></h3>
      ${item.blurb ? `<p>${esc(item.blurb)}</p>` : ""}
      <div class="meta"><span class="src">${shown}</span>${stamp}${arc}
        <button class="save" data-save="${esc(item.id)}" aria-pressed="${saved}"
          >${saved ? "saved" : "save"}</button></div>
    </div></article>`;
}

/* Topic routing is intentionally many-to-one: a Kubernetes CVE belongs in both
   `security` and `kubernetes`, and a reader who picked only one of them still
   needs to see it. A reader who picked both should see it once — but "once" used
   to mean "under whichever shard's fetch resolved first", which made the same
   day render differently run to run and a shared link disagree with what the
   sender saw. Newest edition wins, then highest score, then topic id: stable,
   and across a catch-up it shows the most recent airing rather than an old one. */
function owners(shards){
  const best = new Map();
  for (const shard of shards){
    if (!shard) continue;
    for (const section of shard.sections)
      for (const it of section.items){
        const cur = best.get(it.id);
        const better = !cur
          || shard.date > cur.date
          || (shard.date === cur.date && (it.score > cur.score
              || (it.score === cur.score && shard.topic < cur.topic)));
        if (better)
          best.set(it.id, { topic: shard.topic, score: it.score, date: shard.date });
      }
  }
  return best;
}

function remember(item, shard){
  // What `save` needs later, when the shard is long gone.
  state.rendered.set(item.id, {
    id: item.id, title: item.title, url: item.url,
    date: shard.date, topic: shard.topic, label: shard.label,
    source_count: item.source_count,
  });
}

const fmtDay = d =>
  new Date(d + "T00:00:00Z").toLocaleDateString(undefined,
    { weekday:"long", day:"numeric", month:"long" });
const fmtShort = d =>
  new Date(d + "T00:00:00Z").toLocaleDateString(undefined,
    { weekday:"short", day:"numeric", month:"short" });
const fmtEdition = (d, mode) =>
  mode === "weekly" ? "week to " + fmtShort(d) : fmtDay(d);

function render(shards){
  const q = state.query.trim().toLowerCase();
  const owner = owners(shards);
  const drawn = new Set();
  state.rendered = new Map();
  let html = "", shown = 0, hidden = 0, muted = 0, lastDate = null;

  // Newest edition first; within an edition the fetch order already puts the
  // reader's own topics ahead of the rest. Sort is stable, so that survives.
  const live = shards.filter(Boolean);
  live.sort((a, b) => a.date === b.date ? 0 : (a.date > b.date ? -1 : 1));

  for (const shard of live){
    for (const section of shard.sections){
      const items = section.items.filter(it => {
        const own = owner.get(it.id);
        if (own?.topic !== shard.topic || own?.date !== shard.date) return false;
        if (drawn.has(it.id)) return false;
        if (allMuted(it)){ muted++; return false; }
        if (q && !(it.title + " " + (it.blurb || "")).toLowerCase().includes(q)) return false;
        if (state.unreadOnly && state.read.has(it.id)){ hidden++; return false; }
        return true;
      });
      if (!items.length) continue;
      items.forEach(it => { drawn.add(it.id); remember(it, shard); });
      shown += items.length;
      if (state.catchUp && shard.date !== lastDate){
        html += `<div class="daterule">${esc(fmtShort(shard.date))}</div>`;
        lastDate = shard.date;
      }
      html += `<div class="section-head"><h2>${esc(section.heading)}</h2>
        <span class="topic">${esc(shard.label)}</span></div>`;
      html += items.map(it => storyHTML(it)).join("");
    }
  }

  const banner = [];
  if (state.catchUp)
    {
      const span = Math.min(CATCHUP, editionDates().length);
      banner.push(`unread across the last <b>${span}</b> ${span === 1 ? "edition" : "editions"}`);
    }
  if (q && shown){
    const extra = live.filter(s => !state.topics.has(s.topic)).length;
    banner.push(`searching <b>${new Set(live.map(s => s.topic)).size}</b> topics` +
      (extra > 0 ? ` — ${extra} beyond your selection` : ""));
  }
  if (shown && q) banner.push(`<b>${shown}</b> ${shown === 1 ? "match" : "matches"}`);
  if (muted) banner.push(`<b>${muted}</b> hidden by muted sources`);
  if (banner.length)
    html = `<p class="scope">${banner.join(" · ")}` +
      (q ? ` · <button data-act="archive">search the archive</button>` : "") +
      `</p>` + html;

  if (!shown){
    html = state.topics.size === 0 && !q
      ? `<div class="notice"><h3>Pick a topic</h3>
         <p>Choose one or more topics above to build today's digest.</p></div>`
      : q
      ? `<div class="notice"><h3>No match for “${esc(state.query.trim())}”</h3>
         <p>Nothing in this edition matches.
         <button data-act="archive">Search the whole archive</button>, or
         <button data-act="clearq">clear the filter</button>.</p></div>`
      : state.catchUp
      ? `<div class="notice"><h3>Nothing left to catch up on</h3>
         <p>Every story in the last ${Math.min(CATCHUP, editionDates().length)}
         ${Math.min(CATCHUP, editionDates().length) === 1 ? "edition" : "editions"}
         of your topics has been read.
         <button data-act="nocatchup">Back to one day</button>.</p></div>`
      : state.unreadOnly && hidden
      ? `<div class="notice"><h3>All read</h3>
         <p>${hidden} ${hidden === 1 ? "story" : "stories"} here, all of them read.
         <button data-act="showall">Show read stories</button> or try another edition.</p></div>`
      : muted
      ? `<div class="notice"><h3>Everything here is muted</h3>
         <p>${muted} ${muted === 1 ? "story" : "stories"} came only from sources you
         have muted. <a href="health.html">Unmute a source</a>.</p></div>`
      : `<div class="notice"><h3>Nothing published here yet</h3>
         <p>This edition has no stories for the topics you picked.
         Try the previous one.</p></div>`;
  }

  state.built = live[0]?.built_at ?? null;
  paint(html, `${shown} ${shown === 1 ? "story" : "stories"}`);
}

/* Every view funnels through here so the focus and announcement handling exists
   once. Replacing innerHTML drops focus to <body> and says nothing to a screen
   reader, which made day and topic changes silent and disorienting. */
function paint(html, summary){
  const main = document.getElementById("main");
  const hadFocus = main.contains(document.activeElement);
  main.innerHTML = html;
  if (hadFocus) main.focus();
  updateFooter();
  const unread = document.querySelectorAll(".story.unread").length;
  document.getElementById("status").textContent = `${summary}, ${unread} unread`;
}

function renderSaved(){
  state.rendered = new Map();
  const q = state.query.trim().toLowerCase();
  // Newest save last in the Map, so reverse for most-recent-first.
  const records = [...state.saved.values()].reverse()
    .filter(r => !q || r.title.toLowerCase().includes(q));

  let html = `<p class="scope"><b>${state.saved.size}</b> saved` +
    (q ? ` · <b>${records.length}</b> matching` : "") +
    ` · <button data-act="digest">back to the digest</button></p>`;

  if (!records.length){
    html += state.saved.size
      ? `<div class="notice"><h3>No saved story matches</h3>
         <p><button data-act="clearq">Clear the filter</button>.</p></div>`
      : `<div class="notice"><h3>Nothing saved yet</h3>
         <p>Use <b>save</b> on any story and it lands here — kept on this device,
         and kept after the edition it came from is pruned.</p></div>`;
  } else {
    for (const r of records){
      state.rendered.set(r.id, r);
      html += storyHTML(
        { id:r.id, title:r.title, url:r.url, source_count:r.source_count || 1, sources:[] },
        `${r.label || topicLabel(r.topic)} · ${r.date}`);
    }
  }
  state.built = null;
  paint(html, `${records.length} saved`);
}

/* ── Archive search ───────────────────────────────────────────────────
   The in-edition filter only ever sees what is loaded, which leaves 120 days of
   retention unsearchable. The index is titles only and split by month, and it is
   pulled newest month first on demand: most searches are answered by the most
   recent chunk, and nobody pays for the whole archive to find last Tuesday. */
async function archiveMore(){
  if (!state.archive){
    const catalogue = await getJSON("search/index.json").catch(() => null);
    if (!catalogue) return false;
    state.archive = { months: catalogue.months || [], next: 0, entries: [] };
  }
  const a = state.archive;
  if (a.next >= a.months.length) return false;
  const month = a.months[a.next++];
  const chunk = await getJSON(`search/${month.m}.json`).catch(() => null);
  if (chunk) a.entries.push(...(chunk.items || []));
  return true;
}

async function showArchive(){
  state.view = "archive";
  const main = document.getElementById("main");
  main.setAttribute("aria-busy", "true"); progress(true);
  const ok = await archiveMore();
  main.removeAttribute("aria-busy"); progress(false);
  if (!ok && !state.archive?.entries.length){
    paint(`<div class="notice"><h3>No archive index yet</h3>
      <p>It is written on the next publish.
      <button data-act="digest">Back to the digest</button>.</p></div>`, "0 results");
    return;
  }
  renderArchive();
}

function renderArchive(){
  state.rendered = new Map();
  const q = state.query.trim().toLowerCase();
  const a = state.archive;
  const hits = q ? a.entries.filter(e => e.t.toLowerCase().includes(q)) : [];
  const capped = hits.slice(0, ARCHIVE_CAP);
  const left = a.months.length - a.next;
  const scanned = a.next;

  let html = `<p class="scope">archive · titles only · <b>${scanned}</b> of
    <b>${a.months.length}</b> ${a.months.length === 1 ? "month" : "months"} scanned ·
    <b>${hits.length}</b> ${hits.length === 1 ? "match" : "matches"}` +
    (left > 0 ? ` · <button data-act="older">search further back</button>` : "") +
    ` · <button data-act="digest">back to the digest</button></p>`;

  if (!capped.length){
    html += `<div class="notice"><h3>No match for “${esc(state.query.trim())}”</h3>
      <p>${left > 0
        ? `Nothing in the ${scanned} most recent ${scanned === 1 ? "month" : "months"}.
           <button data-act="older">Search further back</button>.`
        : `Nothing anywhere in the archive.`}</p></div>`;
  } else {
    let lastDate = null;
    for (const e of capped){
      if (e.d !== lastDate){
        html += `<div class="daterule">${esc(fmtShort(e.d))}</div>`;
        lastDate = e.d;
      }
      const record = { id:e.i, title:e.t, url:e.u, date:e.d, topic:e.p,
                       label:topicLabel(e.p), source_count:e.n || 1 };
      state.rendered.set(e.i, record);
      html += storyHTML(
        { id:e.i, title:e.t, url:e.u, source_count:e.n || 1, sources:[] },
        topicLabel(e.p));
    }
    if (hits.length > capped.length)
      html += `<p class="scope">showing the first <b>${capped.length}</b> of
        <b>${hits.length}</b> — narrow the filter to see the rest</p>`;
  }
  state.built = null;
  paint(html, `${hits.length} archive ${hits.length === 1 ? "result" : "results"}`);
}

function rerender(){
  if (state.view === "saved") return renderSaved();
  if (state.view === "archive") return renderArchive();
  if (!state.shown.length) return refresh();   // nothing fetched yet
  render(state.shown);
}

function updateFooter(){
  const bits = [];
  if (state.view === "saved"){
    bits.push(`${state.saved.size} saved`);
  } else if (state.view === "archive"){
    bits.push(`archive search`);
  } else {
    const total  = document.querySelectorAll(".story").length;
    const unread = document.querySelectorAll(".story.unread").length;
    const built  = state.built
      ? state.built.slice(0, 16).replace("T", " ") + " UTC" : "—";
    bits.push(`${total} shown`, `${unread} unread`, `built ${built}`);
    if (unread) bits.push(`<button id="readall">mark all read</button>`);
  }
  bits.push(state.view === "digest"
    ? `<button data-act="saved">saved (${state.saved.size})</button>`
    : `<button data-act="digest">digest</button>`);
  // One selected topic means the reader wants that feed, not the firehose.
  const feed = state.topics.size === 1
    ? `data/feed/${[...state.topics][0]}.xml` : "data/feed.xml";
  bits.push(`<a href="${feed}">rss</a>`);
  if (state.muted.size)
    bits.push(`<a href="health.html">${state.muted.size} muted</a>`);
  bits.push(`<a href="health.html">sources</a>`);
  document.getElementById("footer").innerHTML = bits.join(" · ");
}

function progress(on){
  document.getElementById("progress").hidden = !on;
}

async function refresh(){
  writeHash();
  if (state.view === "saved") return renderSaved();
  if (state.view === "archive") return renderArchive();

  const main = document.getElementById("main");
  const q = state.query.trim();
  const dates = state.catchUp
    ? editionDates().slice(0, CATCHUP)
    : [state.date];

  /* A filter that only searched the selected topics sent the reader off to try
     other days by hand. An edition is a few tens of KB, so with a query the
     search covers every topic that published — selected ones first, so their
     sections still lead. */
  const jobs = [];
  for (const date of dates){
    const available = Object.keys(shardsFor(date));
    const wanted = q
      ? [...available].sort((a, b) =>
          (state.topics.has(b) ? 1 : 0) - (state.topics.has(a) ? 1 : 0))
      : [...state.topics].filter(t => available.includes(t));
    for (const topic of wanted) jobs.push([date, topic]);
  }

  const gen = ++state.gen;
  const slow = setTimeout(() => {
    main.setAttribute("aria-busy", "true"); progress(true);
  }, 150);   // no flicker for a cache hit, feedback for anything slower

  const shards = await Promise.all(jobs.map(([d, t]) => loadShard(d, t)));

  clearTimeout(slow);
  // A reader tapping through editions faster than the network answers must not
  // get an older response painted over a newer one.
  if (gen !== state.gen) return;
  main.removeAttribute("aria-busy"); progress(false);

  state.shown = shards;
  render(shards);
  syncControls();
}

function syncControls(){
  const dates = editionDates();
  const i = dates.indexOf(state.date);
  const spanning = state.catchUp;
  document.getElementById("prev").disabled = spanning || i >= dates.length - 1;
  document.getElementById("next").disabled = spanning || i <= 0;
  document.getElementById("editions").disabled = spanning;
  document.getElementById("editions").value =
    (state.mode === "weekly" ? "w:" : "d:") + state.date;
  document.getElementById("modebadge").hidden = state.mode !== "weekly";
}

function drawEditions(){
  const opt = (d, m) =>
    `<option value="${m}:${d}">${esc(fmtEdition(d, m === "w" ? "weekly" : "daily"))}</option>`;
  let html = `<optgroup label="Daily">` +
    state.manifest.dates.map(d => opt(d, "d")).join("") + `</optgroup>`;
  const weeks = state.manifest.weeks || [];
  if (weeks.length)
    html += `<optgroup label="Weekly rollup">` +
      weeks.map(d => opt(d, "w")).join("") + `</optgroup>`;
  document.getElementById("editions").innerHTML = html;
}

function drawChips(){
  const box = document.getElementById("chips");
  // Under catch-up the counts belong to no single edition; the newest one is the
  // honest thing to show, and it is the one the reader is about to look at.
  const today = shardsFor(state.catchUp ? editionDates()[0] : state.date);
  /* Counts used to come from `topics[id].total`, which the manifest sums across
     every retained day — so on any edition but the latest a chip advertised
     stories that were not there. These are this edition's counts, and a topic
     that published nothing is dimmed. Selected chips sort first so a choice made
     yesterday is never parked off the right edge. */
  const items = Object.entries(state.manifest.topics).map(([id, t]) => ({
    id, label: t.label, n: today[id]?.items ?? 0, on: state.topics.has(id),
  })).sort((a, b) =>
    (b.on - a.on) || (b.n - a.n) || a.label.localeCompare(b.label));

  box.innerHTML = items.map(t =>
    `<button class="chip${t.n ? "" : " empty"}" data-topic="${t.id}"
       aria-pressed="${t.on}"${t.n ? "" : ` title="nothing published in ${esc(t.label)} here"`}>
      ${esc(t.label)}<span class="n">${t.n}</span></button>`).join("");
  updateChipFade();
}

function updateChipFade(){
  const box = document.getElementById("chips");
  const wrap = document.getElementById("chipwrap");
  wrap.classList.toggle("fade-l", box.scrollLeft > 4);
  wrap.classList.toggle("fade-r",
    box.scrollLeft + box.clientWidth < box.scrollWidth - 4);
}

function step(delta){
  if (state.catchUp) return;
  const d = editionDates();
  const i = d.indexOf(state.date) + delta;
  if (i < 0 || i >= d.length) return;
  goto(d[i], state.mode);
}

function goto(date, mode){
  // Choosing one edition contradicts spanning several.
  state.catchUp = false;
  document.getElementById("catchup").setAttribute("aria-pressed", "false");
  state.view = "digest";
  state.mode = mode;
  state.date = date;
  drawChips();          // counts and dimming are per-edition
  refresh();
}

function setUnreadOnly(on){
  state.unreadOnly = on;
  document.getElementById("unreadonly").setAttribute("aria-pressed", String(on));
  // Catch-up *is* unread across editions; switching unread off leaves it
  // meaningless, so it collapses back to one day.
  if (!on && state.catchUp) return setCatchUp(false);
  writeHash();
  rerender();
}

function setCatchUp(on){
  state.catchUp = on;
  if (on){
    state.mode = "daily";
    state.unreadOnly = true;
    state.view = "digest";
    if (!editionDates().includes(state.date)) state.date = state.manifest.latest;
  }
  document.getElementById("catchup").setAttribute("aria-pressed", String(on));
  document.getElementById("unreadonly").setAttribute("aria-pressed", String(state.unreadOnly));
  drawChips();
  refresh();
}

function setView(view){
  state.view = view;
  if (view === "digest") { refresh(); return; }
  writeHash();
  rerender();
}

async function boot(){
  readHash(); restoreTopics();
  state.read = loadRead();
  state.saved = loadSaved();
  state.muted = loadMuted();

  document.getElementById("main").addEventListener("click", e => {
    const save = e.target.closest("button[data-save]");
    if (save){ toggleSave(save.dataset.save, save); return; }

    const btn = e.target.closest("button[data-act]");
    if (btn){
      const act = btn.dataset.act;
      if (act === "clearq"){
        state.query = ""; document.getElementById("search").value = "";
        state.view === "digest" ? refresh() : rerender();
      }
      else if (act === "showall") setUnreadOnly(false);
      else if (act === "nocatchup"){ state.unreadOnly = false; setCatchUp(false); }
      else if (act === "saved") setView("saved");
      else if (act === "digest") setView("digest");
      else if (act === "archive" || act === "older") showArchive();
      return;
    }

    // Opening a story is the only thing that marks it read. Nothing is marked on
    // scroll or on render: an item you never looked at must still be there
    // tomorrow, or unread means nothing.
    const story = e.target.closest(".story");
    if (!story) return;
    if (e.target.closest("a")){ markRead(story.dataset.id, story); return; }
    /* The headline was the only tap target, so tapping the blurb — half the
       height of the row — did nothing. Opening from anywhere on the card is a
       bigger target without changing what counts as reading. Bail on a live
       selection so dragging to select a headline does not navigate. */
    const sel = getSelection();
    if (sel && !sel.isCollapsed) return;
    markRead(story.dataset.id, story);
    // No features string: passing one makes some browsers open a popup window
    // rather than a tab. Severing opener by hand instead.
    const w = window.open(story.dataset.url, "_blank");
    if (w) w.opener = null;
  });

  document.getElementById("footer").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.act === "saved") return setView("saved");
    if (btn.dataset.act === "digest") return setView("digest");
    if (btn.id !== "readall") return;
    document.querySelectorAll(".story.unread").forEach(el => {
      state.read.add(el.dataset.id);
      el.classList.remove("unread");
      el.querySelector(".sr-unread")?.remove();
    });
    saveRead();
    // With the unread filter on, "mark all read" empties the view by definition
    // — that is the point, so this one does re-render.
    state.unreadOnly ? rerender() : updateFooter();
  });

  try {
    state.manifest = await getJSON("index.json");
  } catch {
    document.getElementById("main").innerHTML =
      `<div class="notice"><h3>No digest data</h3>
       <p>Run the digest workflow once to publish the first edition.</p></div>`;
    return;
  }
  if (!editionDates().includes(state.date)){
    // A hash pointing at a rollup date that no longer exists must not strand the
    // reader on an empty edition space.
    if (state.mode === "weekly" && !(state.manifest.weeks || []).length)
      state.mode = "daily";
    state.date = editionDates()[0] || state.manifest.latest;
  }
  if (!state.topics.size)
    state.topics = new Set(Object.keys(state.manifest.topics).slice(0, 3));

  const n = Object.keys(state.manifest.topics).length;
  const d = state.manifest.dates.length;
  const w = (state.manifest.weeks || []).length;
  document.getElementById("sourceline").textContent =
    `${n} topics · ${d} edition${d === 1 ? "" : "s"}` +
    (w ? ` · ${w} rollup${w === 1 ? "" : "s"}` : "");

  drawEditions();
  drawChips();
  document.getElementById("chips").onscroll = updateChipFade;
  addEventListener("resize", updateChipFade);

  document.getElementById("chips").onclick = e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    const id = b.dataset.topic;
    state.topics.has(id) ? state.topics.delete(id) : state.topics.add(id);
    b.setAttribute("aria-pressed", state.topics.has(id));
    if (state.view !== "digest") state.view = "digest";
    refresh();
  };

  document.getElementById("prev").onclick = () => step(1);   // dates are newest-first
  document.getElementById("next").onclick = () => step(-1);
  document.getElementById("editions").onchange = e => {
    const [m, date] = e.target.value.split(":");
    const mode = m === "w" ? "weekly" : "daily";
    const known = (mode === "weekly" ? state.manifest.weeks : state.manifest.dates) || [];
    // An unrecognised value would set the date to undefined and render an empty
    // page with nothing to explain it. Put the control back instead.
    if (!date || !known.includes(date)) return syncControls();
    goto(date, mode);
  };

  const search = document.getElementById("search");
  search.value = state.query;
  let t;
  search.oninput = e => {
    clearTimeout(t);
    t = setTimeout(() => {
      state.query = e.target.value;
      // A live query in the archive view re-filters what is already loaded
      // rather than dropping the reader back into one edition — but emptying it
      // there leaves nothing to show, so that falls back to the digest.
      if (state.view === "archive" && !state.query.trim()) return setView("digest");
      state.view === "digest" ? refresh() : rerender();
    }, 140);
  };

  const unreadBtn = document.getElementById("unreadonly");
  unreadBtn.setAttribute("aria-pressed", String(state.unreadOnly));
  unreadBtn.onclick = () => setUnreadOnly(!state.unreadOnly);

  const catchBtn = document.getElementById("catchup");
  catchBtn.setAttribute("aria-pressed", String(state.catchUp));
  catchBtn.onclick = () => setCatchUp(!state.catchUp);

  /* Keyboard: a daily reader on a desktop should not have to aim at the arrows.
     j/k mirror the arrows rather than moving between stories — editions are the
     only axis this page navigates. */
  addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const el = ev.target;
    if (el && (/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName) || el.isContentEditable)) return;
    if (el?.closest?.(".chips")) return;   // arrows there belong to the chip row
    if (ev.key === "ArrowLeft"  || ev.key === "j") step(1);
    else if (ev.key === "ArrowRight" || ev.key === "k") step(-1);
    else if (ev.key === "u") setUnreadOnly(!state.unreadOnly);
    else if (ev.key === "c") setCatchUp(!state.catchUp);
    else if (ev.key === "s") setView(state.view === "saved" ? "digest" : "saved");
    else if (ev.key === "/"){ ev.preventDefault(); search.focus(); }
    else return;
    ev.preventDefault();
  });

  // Muting happens on the sources page. Same origin, same localStorage, so the
  // only thing missing is noticing on the way back.
  addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    const now = loadMuted();
    const changed = now.size !== state.muted.size ||
      [...now].some(id => !state.muted.has(id));
    if (changed){ state.muted = now; rerender(); }
  });

  // Relative stamps go stale on a tab left open overnight.
  setInterval(() => {
    document.querySelectorAll(".when").forEach(el => {
      el.textContent = when(el.dataset.iso);
    });
  }, 60000);

  await refresh();
}

const off = document.getElementById("offline");
addEventListener("online",  () => off.hidden = true);
addEventListener("offline", () => off.hidden = false);
off.hidden = navigator.onLine;

if ("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  // A worker that has just taken over was not listening when this page posted
  // its topics, so tell the new one too.
  navigator.serviceWorker.addEventListener("controllerchange", postTopics);
}

boot();
</script>
</body>
</html>
