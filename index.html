<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire — tech digest</title>
<meta name="description" content="One digest a day, merged from thirty sources.">

<!-- Two values, not one. A single light theme-color leaves the browser chrome
     pale against a near-black page for every reader in dark mode. -->
<meta name="theme-color" content="#E7E9E4" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#14181F" media="(prefers-color-scheme:dark)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS ignores the manifest when it makes a home-screen icon, so the PWA the
     safe-area padding exists for would install with a screenshot without these. -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wire">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Type is self-hosted. Loaded from Google, a render-blocking stylesheet on
     two extra hosts gates first paint — which sits badly beside a 2.5s data
     timeout — and offline, the case the service worker exists for, the page
     falls back to Georgia and reflows. `latin` is precached by the worker;
     `latin-ext` is fetched only if a headline needs it, then cached at runtime. -->
<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>

<style>

@font-face{font-family:'Newsreader';font-style:italic;font-weight:400;font-display:swap;src:url(fonts/newsreader-italic-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}

:root{
  --paper:#E7E9E4;
  --raised:#F2F3F0;
  --ink:#14181F;
  --ink-soft:#5A6270;
  --rule:#CBCFC8;
  --signal:#B33A1A;
  --pine:#2F5D50;

  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;

  --gutter:clamp(14px,4vw,28px);
  /* Five strokes plus their gaps come to 22px; the column is sized to that
     rather than to the count text, which now only appears above five sources.
     Fixed, not shrink-to-fit: the strokes need a common left origin or the
     shapes stop being comparable down the column, and headlines would stop
     lining up row to row. */
  --tally-w:28px;
  --veil:color-mix(in srgb,var(--paper) 92%,transparent);
  /* Touch targets. 44px is the iOS and WCAG 2.5.5 floor; chips sit a little
     under it because three stacked control rows would otherwise eat a fifth
     of a phone screen before a single headline. */
  --tap:44px;
  --tap-chip:38px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#14181F; --raised:#1B212A; --ink:#E7E9E4; --ink-soft:#8B94A3;
    --rule:#2C3540; --signal:#E0674A; --pine:#7FB3A1;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
main:focus{outline:none}

/* Screen-reader-only. Several things on this page are legible purely as shape —
   the tally, the unread dot — and each needs a text equivalent. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Masthead ─────────────────────────────────────────────────── */
.masthead{padding:calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) 0}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft);
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--signal)}
.wordmark{
  font-family:var(--display); font-weight:800;
  font-size:clamp(38px,13vw,68px); line-height:.9;
  letter-spacing:-.035em; margin:8px 0 2px;
}
.standfirst{
  font-family:var(--body); font-style:italic; color:var(--ink-soft);
  font-size:15px; margin:0 0 var(--gutter);
}

/* ── Sticky controls ──────────────────────────────────────────── */
.controls{
  position:sticky; top:0; z-index:20;
  background:var(--veil);
  backdrop-filter:blur(10px);
  border-block:1px solid var(--rule);
}
.datebar{
  display:flex; align-items:center; gap:6px;
  padding:0 calc(var(--gutter) - 8px); font-family:var(--mono); font-size:12px;
}
.navbtn{
  border:1px solid var(--rule); border-radius:999px;
  width:var(--tap); height:var(--tap); line-height:1;
  display:grid; place-items:center; flex:0 0 auto; font-size:15px;
}
.navbtn[disabled]{opacity:.3;cursor:default}

/* The edition list doubles as the date display and the jump target: with 120
   days retained, stepping one day at a time is 120 clicks to reach the end. */
.editionwrap{position:relative; flex:1; min-width:0; display:flex}
.editions{
  flex:1; min-width:0; height:var(--tap);
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--ink); background:none; border:none; cursor:pointer;
  padding:0 22px 0 8px; appearance:none; -webkit-appearance:none;
  text-overflow:ellipsis;
}
.editionwrap .caret{position:absolute; right:6px; top:50%; translate:0 -50%;
  font-style:normal; font-size:10px; color:var(--ink-soft); pointer-events:none}

/* A 17-topic row scrolls, and nothing said so: no scrollbar, no edge cue, and
   the reader's own selection could sit off-screen where they cannot unset it.
   The fades are the cue; `selected first` in drawChips is the other half. */
.chipwrap{position:relative}
.chipwrap::before,.chipwrap::after{
  content:""; position:absolute; top:0; bottom:0; width:26px; z-index:1;
  pointer-events:none; opacity:0; transition:opacity .15s;
}
.chipwrap::before{left:0;background:linear-gradient(90deg,var(--veil),transparent)}
.chipwrap::after{right:0;background:linear-gradient(270deg,var(--veil),transparent)}
.chipwrap.fade-l::before{opacity:1}
.chipwrap.fade-r::after{opacity:1}

.chips{display:flex; gap:7px; overflow-x:auto; padding:0 var(--gutter) 8px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; font-family:var(--mono); font-size:12px; letter-spacing:.04em;
  min-height:var(--tap-chip); padding:0 12px;
  display:inline-flex; align-items:center;
  border:1px solid var(--rule); border-radius:999px;
  color:var(--ink-soft); white-space:nowrap; transition:background .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.chip .n{opacity:.55;margin-left:5px}
/* Dimmed, not disabled: a topic with nothing today is still worth picking for
   the day you navigate to next. */
.chip.empty{opacity:.42}

.filterbar{display:flex; gap:8px; padding:0 var(--gutter) 8px; align-items:stretch}
.search{
  flex:1; min-width:0; font-family:var(--mono); font-size:13px;
  min-height:var(--tap-chip); padding:0 11px; background:var(--raised);
  border:1px solid var(--rule); border-radius:4px; color:var(--ink);
}
.search::placeholder{color:var(--ink-soft)}
.toggle{
  flex:0 0 auto; font-family:var(--mono); font-size:12px; letter-spacing:.04em;
  min-height:var(--tap-chip); padding:0 13px;
  border:1px solid var(--rule); border-radius:4px; color:var(--ink-soft);
}
.toggle[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--paper)}

/* Fetches are network-first with a 2.5s fallback, so a topic toggle on a weak
   connection could sit for seconds showing the previous day with no signal. */
.progress{height:2px;overflow:hidden;background:transparent}
.progress i{display:block;height:100%;width:38%;background:var(--signal);
  animation:slide 1.1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(360%)}}

/* ── Digest body ──────────────────────────────────────────────── */
main{padding:0 var(--gutter) 64px; max-width:720px; margin:0 auto}
main[aria-busy="true"]{opacity:.45;transition:opacity .12s}

.scope{
  font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  color:var(--ink-soft); margin:18px 0 0; padding-bottom:2px;
}
.scope b{color:var(--ink);font-weight:500}

.section-head{
  display:flex; align-items:baseline; gap:12px;
  margin:34px 0 4px; padding-bottom:6px; border-bottom:1.5px solid var(--ink);
}
.section-head h2{
  font-family:var(--display); font-weight:600; font-size:19px;
  letter-spacing:-.01em; margin:0; flex:1;
}
.section-head .topic{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--pine);
}

/* padding-left gives the unread dot a home that does not depend on the tally
   column existing, so the dot sits in the same place on every row whether or
   not that story has a tally. */
.story{display:flex; gap:12px; padding:16px 0 16px 16px; position:relative;
  border-bottom:1px solid var(--rule); cursor:pointer}
.story:last-child{border-bottom:none}
.story:hover h3 a{text-decoration:underline;text-decoration-color:var(--signal);
  text-underline-offset:3px}

/* ── Signature: the corroboration tally ───────────────────────── */
/* One stroke per independent source that carried the story. Groups of five are
   struck through, so "everyone ran this" is legible before the headline.
   Rendered only at two sources or more: on real data all but a handful of
   stories carry one source, and a column that says "1" on every row spends the
   most prominent 38px on the page to say nothing. Absent, the story runs full
   width — so seeing a tally at all already means corroboration. */
/* The margin is separation from the unread dot, which is also signal red and
   would otherwise read as a third stroke. Only corroborated rows pay for it —
   solo stories keep the full measure for their headline. */
.tally{flex:0 0 var(--tally-w); padding-top:7px; margin-left:6px}
.tally-groups{display:flex; flex-wrap:wrap; gap:7px}
.tally-group{position:relative; display:flex; gap:3px; height:15px}
.stroke{
  width:2px; height:15px; background:var(--signal);
  transform-origin:bottom; animation:grow .5s cubic-bezier(.2,.9,.3,1) backwards;
}
.tally-group.full .strike{
  position:absolute; inset:0; width:100%; height:15px;
}
.tally-group.full .strike::after{
  content:""; position:absolute; left:-3px; right:-3px; top:50%;
  height:2px; background:var(--signal); transform:rotate(-24deg);
}
/* Shown only once the strokes stop being countable at a glance. At two sources
   "2src" is wider and heavier than the mark it labels, which inverts the point:
   the shape is the signal. The exact number is always on the aria-label. */
.tally-count{
  font-family:var(--mono); font-size:10px; color:var(--ink-soft);
  margin-top:5px; letter-spacing:.06em;
}
.tally-count[hidden]{display:none}
@keyframes grow{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}

.story-body{flex:1; min-width:0}
.story h3{
  font-family:var(--display); font-weight:600; font-size:17px;
  line-height:1.28; letter-spacing:-.012em; margin:0 0 5px;
}
.story h3 a{text-decoration:none}
.story p{margin:0 0 7px; font-size:15.5px; color:var(--ink-soft); line-height:1.45}
.meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  color:var(--ink-soft); display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.meta .sep{opacity:.4}
.meta .src{color:var(--ink)}
/* The arc reads "day 3 · was 2 src": the tally moving, not a reading of it.
   Pine, not signal — signal stays reserved for the tally and unread. */
.meta .arc{color:var(--pine)}

/* Unread marker. The only other thing on the page allowed to be signal red.
   Absolutely positioned into the story's left padding rather than inline: an
   inline dot pushes the first line right and leaves wrapped lines behind it,
   so the left edge of every headline would shift as stories are read. */
.story.unread::before{
  content:""; position:absolute; left:2px; top:24px;
  width:6px; height:6px; border-radius:50%; background:var(--signal);
}

/* ── States ───────────────────────────────────────────────────── */
.notice{
  margin:24px 0; padding:14px 16px; border:1px solid var(--rule);
  border-left:3px solid var(--signal); background:var(--raised);
}
.notice h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 4px}
.notice p{margin:0;font-size:15px;color:var(--ink-soft)}
.notice button{text-decoration:underline;text-underline-offset:2px}
.skeleton{height:13px;background:var(--rule);border-radius:2px;opacity:.5;
  margin:11px 0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.22}}

footer{
  padding:22px var(--gutter) 40px; max-width:720px; margin:0 auto;
  border-top:1px solid var(--rule); font-family:var(--mono);
  font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft);
}
footer button,footer a{text-decoration:underline;text-underline-offset:2px}
.offline{
  position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:30;
  font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  background:var(--ink); color:var(--paper); padding:7px 14px; border-radius:999px;
}
[hidden]{display:none !important}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="eyebrow">
    <span class="dot" aria-hidden="true"></span>
    <span id="sourceline">loading</span>
  </div>
  <h1 class="wordmark">Wire</h1>
  <p class="standfirst">One digest a day, merged from thirty sources.</p>
</header>

<div class="controls">
  <div class="datebar">
    <button class="navbtn" id="prev" aria-label="Previous day">‹</button>
    <span class="editionwrap">
      <select class="editions" id="editions" aria-label="Edition date"></select>
      <i class="caret" aria-hidden="true">▾</i>
    </span>
    <button class="navbtn" id="next" aria-label="Next day">›</button>
  </div>
  <div class="chipwrap" id="chipwrap">
    <div class="chips" id="chips" role="group" aria-label="Topics"></div>
  </div>
  <div class="filterbar">
    <input class="search" id="search" type="search" placeholder="filter headlines — all topics"
           aria-label="Filter headlines across every topic in this edition">
    <button class="toggle" id="unreadonly" aria-pressed="false">unread</button>
  </div>
  <div class="progress" id="progress" hidden aria-hidden="true"><i></i></div>
</div>

<main id="main" tabindex="-1">
  <div class="skeleton" style="width:60%"></div>
  <div class="skeleton" style="width:85%"></div>
  <div class="skeleton" style="width:72%"></div>
</main>

<p class="sr" id="status" role="status" aria-live="polite"></p>
<footer id="footer"></footer>
<div class="offline" id="offline" hidden>offline — showing cached</div>

<script>
const DATA = "data/";
const state = { manifest:null, date:null, topics:new Set(), query:"",
                unreadOnly:false, shards:new Map(), shown:[], read:new Set(),
                built:null, gen:0 };

/* Read state is per-device and disposable — it must never be required for the
   page to work, so every access is in try/catch and the cap is a hard slice
   rather than anything cleverer. Item ids are stable (an FNV hash of the
   canonical URL), so a story keeps its read state across days and topics. */
const READ_KEY = "read";
const READ_CAP = 4000;
function loadRead(){
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveRead(){
  try {
    localStorage.setItem(READ_KEY,
      JSON.stringify([...state.read].slice(-READ_CAP)));
  } catch {}
}
/* Deliberately does not re-render, even with the unread filter on: pulling a
   story out from under the finger that just opened it loses the reader their
   place. It leaves on the next render. */
function markRead(id, el){
  if (state.read.has(id)) return;
  state.read.add(id);
  saveRead();
  el?.classList.remove("unread");
  el?.querySelector(".sr-unread")?.remove();
  updateFooter();
}

/* URL hash is the source of truth for shareable state — including the query,
   so a search can be sent to someone. localStorage only remembers topic choice
   between visits and is never required to work. */
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("d")) state.date = p.get("d");
  if (p.get("t")) state.topics = new Set(p.get("t").split(",").filter(Boolean));
  if (p.get("q")) state.query = p.get("q");
  if (p.get("u") === "1") state.unreadOnly = true;
}
function writeHash(){
  const p = new URLSearchParams();
  if (state.date) p.set("d", state.date);
  if (state.topics.size) p.set("t", [...state.topics].join(","));
  if (state.query.trim()) p.set("q", state.query.trim());
  if (state.unreadOnly) p.set("u", "1");
  history.replaceState(null, "", "#" + p);
  try { localStorage.setItem("topics", [...state.topics].join(",")); } catch {}
}
function restoreTopics(){
  if (state.topics.size) return;
  try {
    const saved = localStorage.getItem("topics");
    if (saved) state.topics = new Set(saved.split(",").filter(Boolean));
  } catch {}
}

async function getJSON(path){
  const r = await fetch(DATA + path, { cache:"no-cache" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

async function loadShard(date, topic){
  const key = date + "/" + topic;
  if (state.shards.has(key)) return state.shards.get(key);
  const data = await getJSON(key + ".json").catch(() => null);
  state.shards.set(key, data);
  return data;
}

/* Which topics published on the day being read. The manifest carries this per
   date, which is what makes honest per-day chip counts possible. */
function dayShards(date){ return state.manifest.shards?.[date] || {}; }

/* ── Tally: one stroke per source, struck through in fives ── */
const TALLY_MAX = 20;   // wraps rather than truncating; the label is exact
function tally(n){
  const groups = [];
  let left = Math.min(n, TALLY_MAX);
  let i = 0;
  while (left > 0){
    const size = Math.min(left, 5);
    const strokes = Array.from({length:size}, () =>
      `<i class="stroke" style="animation-delay:${(i++) * 45}ms"></i>`).join("");
    groups.push(
      `<span class="tally-group${size === 5 ? " full" : ""}">${strokes}` +
      (size === 5 ? `<i class="strike"></i>` : "") + `</span>`);
    left -= size;
  }
  // role=img with a label: the strokes are empty elements, so without this a
  // screen reader gets either nothing or a run of blanks.
  return `<div class="tally" role="img" aria-label="${n} sources carried this story">` +
         `<div class="tally-groups">${groups.join("")}</div>` +
         `<div class="tally-count"${n > 5 ? "" : " hidden"}>${n}&#8202;src</div></div>`;
}

/* Relative time is only meaningful on the current edition. Four weeks back,
   "31d ago" is accurate and useless — that reader wants the timestamp. */
function when(iso){
  const d = new Date(iso);
  if (state.date !== state.manifest?.latest)
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short" }) + " " +
           d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  const h = (Date.now() - d) / 36e5;
  if (h < 1) return "just now";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function storyHTML(item){
  const names = item.sources.map(s => s.name);
  const shown = names.slice(0, 2).map(esc).join(", ") +
    (names.length > 2 ? ` +${names.length - 2}` : "");
  const unread = state.read.has(item.id) ? "" : " unread";
  /* Only present when the story was published before and came back because
     it gained a source — so it always says something the tally alone cannot. */
  const arc = item.arc
    ? `<span class="sep">/</span><span class="arc">day ${item.arc.days} ·
       was ${item.arc.was}&#8202;src</span>`
    : "";
  return `<article class="story${unread}" data-id="${esc(item.id)}" data-url="${esc(item.url)}">
    ${unread ? `<span class="sr sr-unread">unread</span>` : ""}
    ${item.source_count > 1 ? tally(item.source_count) : ""}
    <div class="story-body">
      <h3><a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a></h3>
      ${item.blurb ? `<p>${esc(item.blurb)}</p>` : ""}
      <div class="meta"><span class="src">${shown}</span>
        <span class="sep">/</span>
        <span class="when" data-iso="${esc(item.published_at)}">${when(item.published_at)}</span>${arc}</div>
    </div></article>`;
}

/* Topic routing is intentionally many-to-one: a Kubernetes CVE belongs in both
   `security` and `kubernetes`, and a reader who picked only one of them still
   needs to see it. A reader who picked both should see it once — but "once"
   used to mean "under whichever shard's fetch resolved first", which made the
   same day render differently run to run and a shared link disagree with what
   the sender saw. Highest score wins, topic id breaks ties: stable, and it
   files the story under the topic that rated it most highly. */
function owners(shards){
  const best = new Map();
  for (const shard of shards){
    if (!shard) continue;
    for (const section of shard.sections)
      for (const it of section.items){
        const cur = best.get(it.id);
        if (!cur || it.score > cur.score ||
            (it.score === cur.score && shard.topic < cur.topic))
          best.set(it.id, { topic: shard.topic, score: it.score });
      }
  }
  return best;
}

function render(shards){
  const main = document.getElementById("main");
  const q = state.query.trim().toLowerCase();
  const owner = owners(shards);
  const drawn = new Set();
  let html = "", shown = 0, hidden = 0;

  for (const shard of shards){
    if (!shard) continue;
    for (const section of shard.sections){
      const items = section.items.filter(it => {
        if (owner.get(it.id)?.topic !== shard.topic || drawn.has(it.id)) return false;
        if (q && !(it.title + " " + (it.blurb || "")).toLowerCase().includes(q)) return false;
        if (state.unreadOnly && state.read.has(it.id)){ hidden++; return false; }
        return true;
      });
      if (!items.length) continue;
      items.forEach(it => drawn.add(it.id));
      shown += items.length;
      html += `<div class="section-head"><h2>${esc(section.heading)}</h2>
        <span class="topic">${esc(shard.label)}</span></div>`;
      html += items.map(storyHTML).join("");
    }
  }

  /* Searching widens past the selected topics, which would otherwise look like
     the chips being silently ignored. */
  if (q && shown){
    const loaded = shards.filter(Boolean);
    const extra = loaded.filter(s => !state.topics.has(s.topic)).length;
    html = `<p class="scope">searching <b>${loaded.length}</b> topics` +
      (extra > 0 ? ` — ${extra} beyond your selection` : "") +
      ` · <b>${shown}</b> ${shown === 1 ? "match" : "matches"}</p>` + html;
  }

  if (!shown){
    html = state.topics.size === 0 && !q
      ? `<div class="notice"><h3>Pick a topic</h3>
         <p>Choose one or more topics above to build today's digest.</p></div>`
      : q
      ? `<div class="notice"><h3>No match for “${esc(state.query.trim())}”</h3>
         <p>Nothing in this edition's ${Object.keys(dayShards(state.date)).length} topics
         matches. <button data-act="clearq">Clear the filter</button> or try another day.</p></div>`
      : state.unreadOnly && hidden
      ? `<div class="notice"><h3>All read</h3>
         <p>${hidden} ${hidden === 1 ? "story" : "stories"} here, all of them read.
         <button data-act="showall">Show read stories</button> or try another day.</p></div>`
      : `<div class="notice"><h3>Nothing published here yet</h3>
         <p>This day has no stories for the topics you picked. Try the previous day.</p></div>`;
  }

  /* Replacing innerHTML drops focus to <body> and says nothing to a screen
     reader, so day and topic changes used to be silent and disorienting. */
  const hadFocus = main.contains(document.activeElement);
  main.innerHTML = html;
  if (hadFocus) main.focus();

  state.built = shards.find(Boolean)?.built_at ?? null;
  updateFooter();
  const unread = document.querySelectorAll(".story.unread").length;
  document.getElementById("status").textContent =
    `${shown} ${shown === 1 ? "story" : "stories"}, ${unread} unread`;
}

function rerender(){
  if (!state.shown.length) return refresh();   // nothing fetched yet
  render(state.shown);
}

function updateFooter(){
  const total  = document.querySelectorAll(".story").length;
  const unread = document.querySelectorAll(".story.unread").length;
  const built  = state.built
    ? state.built.slice(0, 16).replace("T", " ") + " UTC" : "—";
  document.getElementById("footer").innerHTML =
    `${total} shown · ${unread} unread · built ${built}` +
    (unread ? ` · <button id="readall">mark all read</button>` : "") +
    ` · <a href="health.html">sources</a>`;
}

function progress(on){
  const el = document.getElementById("progress");
  el.hidden = !on;
}

async function refresh(){
  writeHash();
  const main = document.getElementById("main");
  const q = state.query.trim();
  const available = Object.keys(dayShards(state.date));

  /* A filter that only searched the three selected topics sent the reader off
     to try other days by hand. The whole edition is a few tens of KB, so when
     there is a query the search covers every topic that published that day —
     selected ones first, so their sections still lead. */
  const wanted = q
    ? [...available].sort((a, b) =>
        (state.topics.has(b) ? 1 : 0) - (state.topics.has(a) ? 1 : 0))
    : [...state.topics];

  const gen = ++state.gen;
  const slow = setTimeout(() => {
    main.setAttribute("aria-busy", "true"); progress(true);
  }, 150);   // no flicker for a cache hit, feedback for anything slower

  const shards = await Promise.all(wanted.map(t => loadShard(state.date, t)));

  clearTimeout(slow);
  // A reader tapping through days faster than the network answers must not get
  // an older response painted over a newer one.
  if (gen !== state.gen) return;
  main.removeAttribute("aria-busy"); progress(false);

  state.shown = shards;
  render(shards);
  syncControls();
}

function syncControls(){
  const dates = state.manifest.dates;
  const i = dates.indexOf(state.date);
  document.getElementById("prev").disabled = i >= dates.length - 1;
  document.getElementById("next").disabled = i <= 0;
  document.getElementById("editions").value = state.date;
}

const fmtDate = d =>
  new Date(d + "T00:00:00Z").toLocaleDateString(undefined,
    { weekday:"long", day:"numeric", month:"long" });

function drawEditions(){
  document.getElementById("editions").innerHTML = state.manifest.dates
    .map(d => `<option value="${d}">${esc(fmtDate(d))}</option>`).join("");
}

function drawChips(){
  const box = document.getElementById("chips");
  const today = dayShards(state.date);
  /* Counts used to come from `topics[id].total`, which the manifest sums across
     every retained day — so on any edition but the latest a chip advertised
     stories that were not there. These are this day's counts, and a topic that
     published nothing today is dimmed. Selected chips sort first so a choice
     made yesterday is never parked off the right edge. */
  const items = Object.entries(state.manifest.topics).map(([id, t]) => ({
    id, label: t.label, n: today[id]?.items ?? 0, on: state.topics.has(id),
  })).sort((a, b) =>
    (b.on - a.on) || (b.n - a.n) || a.label.localeCompare(b.label));

  box.innerHTML = items.map(t =>
    `<button class="chip${t.n ? "" : " empty"}" data-topic="${t.id}"
       aria-pressed="${t.on}"${t.n ? "" : ` title="nothing published in ${esc(t.label)} on this day"`}>
      ${esc(t.label)}<span class="n">${t.n}</span></button>`).join("");
  updateChipFade();
}

function updateChipFade(){
  const box = document.getElementById("chips");
  const wrap = document.getElementById("chipwrap");
  wrap.classList.toggle("fade-l", box.scrollLeft > 4);
  wrap.classList.toggle("fade-r",
    box.scrollLeft + box.clientWidth < box.scrollWidth - 4);
}

function step(delta){
  const d = state.manifest.dates;
  const i = d.indexOf(state.date) + delta;
  if (i < 0 || i >= d.length) return;
  goto(d[i]);
}

function goto(date){
  state.date = date;
  drawChips();          // counts and dimming are per-day
  refresh();
}

async function boot(){
  readHash(); restoreTopics();
  state.read = loadRead();

  // Opening a story is the only thing that marks it read. Nothing is marked
  // on scroll or on render: an item you never looked at must still be there
  // tomorrow, or unread means nothing.
  document.getElementById("main").addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (btn){
      if (btn.dataset.act === "clearq"){
        state.query = ""; document.getElementById("search").value = ""; refresh();
      } else if (btn.dataset.act === "showall"){
        setUnreadOnly(false);
      }
      return;
    }
    const story = e.target.closest(".story");
    if (!story) return;
    if (e.target.closest("a")){ markRead(story.dataset.id, story); return; }
    /* The headline was the only tap target, so tapping the blurb — half the
       height of the row — did nothing. Opening from anywhere on the card is a
       bigger target without changing what counts as reading. Bail on a live
       selection so dragging to select a headline does not navigate. */
    const sel = getSelection();
    if (sel && !sel.isCollapsed) return;
    markRead(story.dataset.id, story);
    // No features string: passing one makes some browsers open a popup window
    // rather than a tab. Severing opener by hand instead.
    const w = window.open(story.dataset.url, "_blank");
    if (w) w.opener = null;
  });

  document.getElementById("footer").addEventListener("click", e => {
    if (e.target.id !== "readall") return;
    document.querySelectorAll(".story.unread").forEach(el => {
      state.read.add(el.dataset.id);
      el.classList.remove("unread");
      el.querySelector(".sr-unread")?.remove();
    });
    saveRead();
    // With the unread filter on, "mark all read" empties the view by definition
    // — that is the point, so this one does re-render.
    state.unreadOnly ? rerender() : updateFooter();
  });

  try {
    state.manifest = await getJSON("index.json");
  } catch {
    document.getElementById("main").innerHTML =
      `<div class="notice"><h3>No digest data</h3>
       <p>Run the digest workflow once to publish the first edition.</p></div>`;
    return;
  }
  if (!state.manifest.dates.includes(state.date)) state.date = state.manifest.latest;
  if (!state.topics.size)
    state.topics = new Set(Object.keys(state.manifest.topics).slice(0, 3));

  const n = Object.keys(state.manifest.topics).length;
  const e = state.manifest.dates.length;
  document.getElementById("sourceline").textContent =
    `${n} topics · ${e} edition${e === 1 ? "" : "s"}`;

  drawEditions();
  drawChips();
  document.getElementById("chips").onscroll = updateChipFade;
  addEventListener("resize", updateChipFade);

  document.getElementById("chips").onclick = e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    const id = b.dataset.topic;
    state.topics.has(id) ? state.topics.delete(id) : state.topics.add(id);
    b.setAttribute("aria-pressed", state.topics.has(id));
    refresh();
  };

  document.getElementById("prev").onclick = () => step(1);   // dates are newest-first
  document.getElementById("next").onclick = () => step(-1);
  document.getElementById("editions").onchange = e => goto(e.target.value);

  const search = document.getElementById("search");
  search.value = state.query;
  let t;
  search.oninput = e => {
    clearTimeout(t);
    t = setTimeout(() => { state.query = e.target.value; refresh(); }, 140);
  };

  const unreadBtn = document.getElementById("unreadonly");
  unreadBtn.setAttribute("aria-pressed", String(state.unreadOnly));
  unreadBtn.onclick = () => setUnreadOnly(!state.unreadOnly);

  /* Keyboard: a daily reader on a desktop should not have to aim at the arrows.
     j/k mirror the arrows rather than moving between stories — days are the
     only axis this page navigates. */
  addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const t = ev.target;
    if (t && (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable)) return;
    if (t?.closest?.(".chips")) return;   // arrows there belong to the chip row
    if (ev.key === "ArrowLeft"  || ev.key === "j") step(1);
    else if (ev.key === "ArrowRight" || ev.key === "k") step(-1);
    else if (ev.key === "u") setUnreadOnly(!state.unreadOnly);
    else if (ev.key === "/"){ ev.preventDefault(); search.focus(); }
    else return;
    ev.preventDefault();
  });

  // Relative stamps go stale on a tab left open overnight.
  setInterval(() => {
    if (state.date !== state.manifest?.latest) return;
    document.querySelectorAll(".when").forEach(el => {
      el.textContent = when(el.dataset.iso);
    });
  }, 60000);

  await refresh();
}

function setUnreadOnly(on){
  state.unreadOnly = on;
  document.getElementById("unreadonly").setAttribute("aria-pressed", String(on));
  writeHash();
  rerender();
}

const off = document.getElementById("offline");
addEventListener("online",  () => off.hidden = true);
addEventListener("offline", () => off.hidden = false);
off.hidden = navigator.onLine;

if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js"));

boot();
</script>
</body>
</html>
