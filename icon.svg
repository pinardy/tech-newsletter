<!-- A display showing a front page: the digest is a newspaper that arrives on a
     screen. Ink masthead and headline rules, tally in signal red — the same
     colour discipline as the reader, where signal is reserved for the tally.

     Three drawings of one mark, because a 32x reduction destroys detail that a
     512px canvas takes for granted. The browser picks by render size: below
     24px the 16-grid, up to 40px the 32-grid, and the full artwork above that.
     Both grids divide 512 exactly (512/16 = 32, 512/32 = 16), so every edge
     lands on a whole device pixel and nothing is antialiased away.

     The two grids are the same drawings favicon.ico carries as bitmaps, so a
     16px tab looks identical whichever file the browser reaches for. Edit one
     and you must edit the other, or those two paths will disagree. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wire">
  <style>
    /* An SVG rendered as an image gets a viewport equal to the size it is drawn
       at, which is what makes these queries resolve for a favicon. Where a
       browser ignores them it simply keeps the full artwork — the same result as
       before — and favicon.ico covers that case with real bitmaps. */
    .tiny, .small { display: none }
    @media (max-width: 23px) {
      .full { display: none }
      .tiny { display: inline }
    }
    @media (min-width: 24px) and (max-width: 40px) {
      .full { display: none }
      .small { display: inline }
    }
  </style>

  <rect width="512" height="512" fill="#14181F"/>

  <!-- Full artwork. Scaled up about the drawing's own bounding-box centre
       (256 239), not the canvas centre, or the composition sits high: the foot
       hangs below the screen, so the ink is not vertically symmetric. -->
  <g class="full" transform="translate(256 256) scale(1.25) translate(-256 -239)">
    <rect x="112" y="126" width="288" height="176" rx="14" fill="#E7E9E4"/>
    <rect x="134" y="150" width="244" height="28" fill="#14181F"/>
    <g fill="#B33A1A">
      <rect x="134" y="196" width="20" height="76"/>
      <rect x="168" y="196" width="20" height="76"/>
      <rect x="202" y="196" width="20" height="76"/>
    </g>
    <g fill="#14181F">
      <rect x="240" y="196" width="138" height="18"/>
      <rect x="240" y="226" width="138" height="18"/>
      <rect x="240" y="254" width="106" height="18"/>
    </g>
    <rect x="236" y="302" width="40" height="30" fill="#E7E9E4"/>
    <rect x="196" y="330" width="120" height="22" rx="8" fill="#E7E9E4"/>
  </g>

  <!-- 32-grid: three tally strokes and three headline rules still fit. -->
  <g class="small">
    <g fill="#E7E9E4"><rect x="32" y="80" width="448" height="256"/><rect x="224" y="336" width="64" height="32"/><rect x="160" y="368" width="192" height="48"/></g>
    <g fill="#14181F"><rect x="64" y="112" width="384" height="32"/><rect x="224" y="176" width="224" height="32"/><rect x="224" y="224" width="224" height="32"/><rect x="224" y="272" width="160" height="32"/></g>
    <g fill="#B33A1A"><rect x="64" y="176" width="32" height="128"/><rect x="112" y="176" width="32" height="128"/><rect x="160" y="176" width="32" height="128"/></g>
  </g>

  <!-- 16-grid: two strokes and two rules, no corner radii — at this size a
       rounded corner costs a whole pixel of screen. -->
  <g class="tiny">
    <g fill="#E7E9E4"><rect x="32" y="96" width="448" height="224"/><rect x="224" y="320" width="64" height="32"/><rect x="160" y="352" width="192" height="64"/></g>
    <g fill="#14181F"><rect x="64" y="128" width="384" height="32"/><rect x="192" y="192" width="256" height="32"/><rect x="192" y="256" width="256" height="32"/></g>
    <g fill="#B33A1A"><rect x="64" y="192" width="32" height="96"/><rect x="128" y="192" width="32" height="96"/></g>
  </g>
</svg>
